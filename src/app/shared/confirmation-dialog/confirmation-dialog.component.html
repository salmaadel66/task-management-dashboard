<div class="c-confirm">
  <span class="c-confirm__icon" aria-hidden="true">
    <mat-icon>delete_outline</mat-icon>
  </span>

  <h2 mat-dialog-title>{{ data.title | translate }}</h2>

  <mat-dialog-content>
    <p class="c-confirm__message">{{ data.message }}</p>
    <p class="c-confirm__note">{{ 'THIS_ACTION_CANNOT_BE_UNDONE' | translate }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="c-confirm__actions">
    <button class="c-button is-outline" (click)="onCancel()">{{ 'CANCEL' | translate }}</button>
    <button class="c-button is-danger" (click)="onConfirm()">
      {{ data.confirmText | translate }}
    </button>
  </mat-dialog-actions>
</div>
